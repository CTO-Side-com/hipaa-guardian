<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="t d">
  <title id="t">The control library: 75 controls by safeguard area</title>
  <desc id="d">Administrative 29, physical 12, technical 12 and engineering 12, then documentation 5, privacy 2, general 1, organizational 1 and breach 1. Sixty-three controls are regulatory and cite 45 CFR Part 164; twelve are engineering checks grounded in NIST SP 800-66 guidance.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0b0b0b; }
      .s { font-size: 13px; fill: #52514e; }
      .l { font-size: 13px; fill: #0b0b0b; }
      .c { font-size: 12.5px; font-weight: 700; fill: #52514e; }
      .lg { font-size: 12.5px; fill: #52514e; }
      .reg { fill: #2a78d6; }
      .eng { fill: #eb6834; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="391" rx="16" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text class="h" x="36" y="52">75 controls, each traced to its source</text>
  <text class="s" x="36" y="76">Every control in references/controls.json carries its citation, kind (required, addressable, standard) and evidence examples.</text>

  <rect class="reg" x="36" y="96" width="12" height="12" rx="3"/>
  <text class="lg" x="54" y="106.5">Regulatory: cites 45 CFR Part 164 (63)</text>
  <rect class="eng" x="318" y="96" width="12" height="12" rx="3"/>
  <text class="lg" x="336" y="106.5">Engineering: NIST SP 800-66 guidance, not a mandate (12)</text>

  <!-- 19.3 px per control; bars start at x=196 -->
  <line x1="195" y1="124" x2="195" y2="372" stroke="#c3c2b7" stroke-width="1"/>
  <text class="l" x="36" y="141">Administrative</text>
  <path class="reg" d="M196 128h556a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-556z"/>
  <text class="c" x="764" y="141">29</text>
  <text class="l" x="36" y="169">Physical</text>
  <path class="reg" d="M196 156h228a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-228z"/>
  <text class="c" x="436" y="169">12</text>
  <text class="l" x="36" y="197">Technical</text>
  <path class="reg" d="M196 184h228a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-228z"/>
  <text class="c" x="436" y="197">12</text>
  <text class="l" x="36" y="225">Engineering</text>
  <path class="eng" d="M196 212h228a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-228z"/>
  <text class="c" x="436" y="225">12</text>
  <text class="l" x="36" y="253">Documentation</text>
  <path class="reg" d="M196 240h92.5a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-92.5z"/>
  <text class="c" x="304" y="253">5</text>
  <text class="l" x="36" y="281">Privacy</text>
  <path class="reg" d="M196 268h34.6a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-34.6z"/>
  <text class="c" x="247" y="281">2</text>
  <text class="l" x="36" y="309">General</text>
  <path class="reg" d="M196 296h15.3a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-15.3z"/>
  <text class="c" x="227" y="309">1</text>
  <text class="l" x="36" y="337">Organizational</text>
  <path class="reg" d="M196 324h15.3a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-15.3z"/>
  <text class="c" x="227" y="337">1</text>
  <text class="l" x="36" y="365">Breach</text>
  <path class="reg" d="M196 352h15.3a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-15.3z"/>
  <text class="c" x="227" y="365">1</text>
</svg>
