<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="t d">
  <title id="t">What goes in and what comes out</title>
  <desc id="d">Inputs: source code, infrastructure and configuration, human-supplied contracts and policies, and synthetic test data. HIPAA Guardian builds assessment.json covering 75 controls. Outputs: PDF and Markdown reports and a risk register; Jira, Notion, Slack Lists, Slack message and Markdown checklist task files; and PHI data-flow and vendor BAA registers.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#196b77"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0b0b0b; }
      .s { font-size: 13px; fill: #52514e; }
      .k { font-size: 11px; font-weight: 700; fill: #8a8984; letter-spacing: 0.06em; }
      .it { font-size: 13.5px; font-weight: 600; fill: #0b0b0b; }
      .f { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #0b0b0b; }
      .fd { font-size: 11.5px; fill: #52514e; }
      .card { fill: #ffffff; stroke: #e1e0d9; }
      .ar { stroke: #196b77; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="475" rx="16" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text class="h" x="36" y="52">What goes in, what comes out</text>
  <text class="s" x="36" y="76">Everything stays local. Nothing is uploaded, and every output is redacted and marked internal.</text>

  <rect class="card" x="36" y="104" width="212" height="348" rx="12"/>
  <text class="k" x="56" y="132">INPUTS</text>
  <text class="it" x="56" y="166">Source code</text>
  <text class="fd" x="56" y="185">Read-only. Never .env files,</text>
  <text class="fd" x="56" y="201">dumps or patient records</text>
  <text class="it" x="56" y="240">Infrastructure and config</text>
  <text class="fd" x="56" y="259">Terraform, Docker, CI, cloud</text>
  <text class="fd" x="56" y="275">settings</text>
  <text class="it" x="56" y="314">Contracts and policies</text>
  <text class="fd" x="56" y="333">BAAs, risk analysis, training,</text>
  <text class="fd" x="56" y="349">confirmed by a named person</text>
  <text class="it" x="56" y="388">Synthetic test data</text>
  <text class="fd" x="56" y="407">Fake clinics and patients for</text>
  <text class="fd" x="56" y="423">negative tests</text>

  <path class="ar" d="M252 274H290" marker-end="url(#a)"/>

  <rect x="296" y="199" width="196" height="150" rx="14" fill="#196b77"/>
  <text x="316" y="231" font-size="11" font-weight="700" fill="#bfe0e4" letter-spacing="0.06em">HIPAA GUARDIAN</text>
  <text x="316" y="263" font-size="17" font-weight="700" fill="#ffffff">assessment.json</text>
  <text x="316" y="287" font-size="12.5" fill="#d7ecef">75 controls, each with a</text>
  <text x="316" y="305" font-size="12.5" fill="#d7ecef">status, reviewer, evidence</text>
  <text x="316" y="323" font-size="12.5" fill="#d7ecef">and remediation</text>

  <path class="ar" d="M496 274H514V148H530" marker-end="url(#a)"/>
  <path class="ar" d="M514 274V284H530" marker-end="url(#a)"/>
  <path class="ar" d="M514 274V410H530" marker-end="url(#a)"/>

  <rect class="card" x="536" y="96" width="388" height="104" rx="12"/>
  <text class="k" x="556" y="120">REPORTS</text>
  <text class="f" x="556" y="144">HIPAA-READINESS.pdf</text><text class="fd" x="752" y="144">full paginated report</text>
  <text class="f" x="556" y="164">HIPAA-READINESS.md</text><text class="fd" x="752" y="164">Markdown version</text>
  <text class="f" x="556" y="184">risk-register.csv</text><text class="fd" x="752" y="184">owner backlog</text>

  <rect class="card" x="536" y="212" width="388" height="144" rx="12"/>
  <text class="k" x="556" y="236">TASKS</text>
  <text class="f" x="556" y="260">tasks-jira.csv</text><text class="fd" x="752" y="260">Jira CSV import</text>
  <text class="f" x="556" y="280">tasks-notion.csv</text><text class="fd" x="752" y="280">Notion database</text>
  <text class="f" x="556" y="300">tasks-slack-list.csv</text><text class="fd" x="752" y="300">Slack Lists import</text>
  <text class="f" x="556" y="320">tasks-slack.txt</text><text class="fd" x="752" y="320">Slack message</text>
  <text class="f" x="556" y="340">tasks.md</text><text class="fd" x="752" y="340">Markdown checklist</text>

  <rect class="card" x="536" y="368" width="388" height="84" rx="12"/>
  <text class="k" x="556" y="392">REGISTERS</text>
  <text class="f" x="556" y="416">PHI-DATA-FLOWS.md</text><text class="fd" x="752" y="416">trust boundaries</text>
  <text class="f" x="556" y="436">VENDOR-BAA-REGISTER.md</text><text class="fd" x="752" y="436">BAA per service</text>
</svg>
