name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Pinned: setup-python publishes no Python 3.9 build for ubuntu-latest (26.04), and the
    # README promises 3.9+.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib only, offline)
        run: python -m unittest discover -s skills/hipaa-guardian/tests -v
      - name: Example outputs still build
        run: python docs/example/make_example.py
